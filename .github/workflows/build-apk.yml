name: Build Canva Player APK

# Triggers on every push (e.g. whenever you upload/replace CanvaPlayer.zip)
# and can also be started by hand from the Actions tab.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate the project (unzip it if it was uploaded as a .zip)
        id: locate
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found $ZIP_FILE — extracting…"
            mkdir -p _extracted
            unzip -q -o "$ZIP_FILE" -d _extracted

            SETTINGS_FILE=$(find _extracted -maxdepth 4 -iname "settings.gradle.kts" | head -n 1)
            if [ -z "$SETTINGS_FILE" ]; then
              echo "::error::Could not find settings.gradle.kts inside the uploaded zip."
              exit 1
            fi
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          else
            if [ ! -f "settings.gradle.kts" ]; then
              echo "::error::No .zip found and no settings.gradle.kts at repo root."
              exit 1
            fi
            PROJECT_DIR="."
          fi

          echo "Building from: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      - name: Apply Canva Player visual refresh and new launcher icon
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".").resolve()

          # --- Modern launcher icon ---
          res = root / "app" / "src" / "main" / "res"
          (res / "drawable").mkdir(parents=True, exist_ok=True)
          (res / "mipmap-anydpi-v26").mkdir(parents=True, exist_ok=True)
          (res / "values").mkdir(parents=True, exist_ok=True)

          bg = res / "drawable" / "ic_canva_player_bg.xml"
          fg = res / "drawable" / "ic_canva_player_fg.xml"
          mono = res / "drawable" / "ic_canva_player_mono.xml"
          adaptive = res / "mipmap-anydpi-v26" / "ic_launcher.xml"

          bg.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#101828"/>
          </shape>
          ''')
          fg.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M32,26 L76,26 L76,34 L52,34 L52,82 L43,82 L43,34 L32,34 Z"/>
              <path android:fillColor="#6C63FF" android:pathData="M63,44 L76,44 L76,57 L63,57 Z"/>
              <path android:fillColor="#8B5CF6" android:pathData="M63,62 L76,62 L76,75 L63,75 Z"/>
          </vector>
          ''')
          mono.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M32,26 L76,26 L76,34 L52,34 L52,82 L43,82 L43,34 L32,34 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M63,44 L76,44 L76,57 L63,57 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M63,62 L76,62 L76,75 L63,75 Z"/>
          </vector>
          ''')
          adaptive.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_canva_player_bg"/>
              <foreground android:drawable="@drawable/ic_canva_player_fg"/>
              <monochrome android:drawable="@drawable/ic_canva_player_mono"/>
          </adaptive-icon>
          ''')

          legacy = res / "mipmap-mdpi"
          legacy.mkdir(parents=True, exist_ok=True)

          # Point every AndroidManifest application at the new adaptive icon.
          for manifest in root.glob("**/AndroidManifest.xml"):
              text = manifest.read_text(errors="ignore")
              if "android:icon=" in text:
                  text = re.sub(r'android:icon="[^"]+"', 'android:icon="@mipmap/ic_launcher"', text, count=1)
              else:
                  text = text.replace("<application", '<application android:icon="@mipmap/ic_launcher"', 1)
              manifest.write_text(text)

          # --- Add a built-in Quick Tools panel to every HTML canvas ---
          # These tools are local to the player and do not require an account or
          # external service. They are deliberately non-destructive to the canvas.
          const tools_css = r"""
          <style id="canva-player-tools-css">
          #cp-tools-fab{position:fixed;right:16px;bottom:18px;z-index:2147483647;width:54px;height:54px;
            border:0!important;border-radius:18px!important;background:#101828!important;color:#fff!important;
            font-size:22px!important;box-shadow:0 10px 28px rgba(0,0,0,.22)!important}
          #cp-tools-panel{position:fixed;right:14px;bottom:82px;z-index:2147483647;width:min(310px,calc(100vw - 28px));
            padding:14px;border-radius:22px;background:rgba(255,255,255,.97);color:#172033;
            box-shadow:0 18px 50px rgba(0,0,0,.22);border:1px solid rgba(16,24,40,.10);
            font-family:Inter,Roboto,system-ui,sans-serif;display:none}
          #cp-tools-panel.cp-open{display:block}
          #cp-tools-panel .cp-title{font-size:16px;font-weight:750;margin:2px 4px 12px}
          #cp-tools-panel .cp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
          #cp-tools-panel button{min-height:44px!important;padding:8px!important;background:#f7f8fc!important;color:#172033!important;
            font-size:13px!important;font-weight:650!important;border:1px solid rgba(16,24,40,.09)!important}
          #cp-tools-panel .cp-wide{grid-column:1/-1}
          @media(prefers-color-scheme:dark){
            #cp-tools-panel{background:rgba(20,27,45,.98);color:#f4f6fb}
            #cp-tools-panel button{background:#293249!important;color:#f4f6fb!important}
          }
          body.cp-player-dark{background:#0b1020!important;color:#f4f6fb!important}
          </style>
          """
          const tools_js = r"""
          <script id="canva-player-tools-js">
          (()=>{if(window.__CP_TOOLS__)return;window.__CP_TOOLS__=true;
            const $=s=>document.querySelector(s);
            const panel=document.createElement('div');panel.id='cp-tools-panel';
            panel.innerHTML='<div class="cp-title">Canva Player Tools</div><div class="cp-grid">'+
              '<button id="cp-reload">↻ Reload</button><button id="cp-full">⛶ Fullscreen</button>'+
              '<button id="cp-zoomout">− Zoom</button><button id="cp-zoomin">＋ Zoom</button>'+
              '<button id="cp-resetzoom">100% Zoom</button><button id="cp-theme">☾ Theme</button>'+
              '<button id="cp-back">‹ Back</button><button id="cp-forward">› Forward</button>'+
              '<button id="cp-share" class="cp-wide">↗ Share Canvas</button>'+
              '<button id="cp-close" class="cp-wide">Close</button></div>';
            const fab=document.createElement('button');fab.id='cp-tools-fab';fab.type='button';fab.textContent='✦';fab.title='Player tools';
            document.body.append(panel,fab);
            fab.onclick=()=>panel.classList.toggle('cp-open');
            $('#cp-close').onclick=()=>panel.classList.remove('cp-open');
            $('#cp-reload').onclick=()=>location.reload();
            $('#cp-full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};
            let zoom=Number(localStorage.getItem('cpZoom')||1);
            const applyZoom=()=>{document.documentElement.style.zoom=zoom;localStorage.setItem('cpZoom',zoom.toFixed(2))};
            $('#cp-zoomin').onclick=()=>{zoom=Math.min(1.6,zoom+.1);applyZoom()};
            $('#cp-zoomout').onclick=()=>{zoom=Math.max(.6,zoom-.1);applyZoom()};
            $('#cp-resetzoom').onclick=()=>{zoom=1;applyZoom()};
            applyZoom();
            $('#cp-theme').onclick=()=>{document.body.classList.toggle('cp-player-dark');localStorage.setItem('cpDark',document.body.classList.contains('cp-player-dark')?'1':'0')};
            if(localStorage.getItem('cpDark')==='1')document.body.classList.add('cp-player-dark');
            $('#cp-back').onclick=()=>history.back();$('#cp-forward').onclick=()=>history.forward();
            $('#cp-share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:document.title||'Canva Player',url:location.href});else if(navigator.clipboard)await navigator.clipboard.writeText(location.href)}catch(e){}};
          })();
          </script>
          """
          # Inject the tools once into every HTML document.
          for html in root.glob("**/*.html"):
              s = html.read_text(errors="ignore")
              if "canva-player-tools-js" in s:
                  continue
              if re.search(r"</body>", s, re.I):
                  s = re.sub(r"</body>", tools_css + tools_js + "</body>", s, count=1, flags=re.I)
              elif re.search(r"</html>", s, re.I):
                  s = re.sub(r"</html>", tools_css + tools_js + "</html>", s, count=1, flags=re.I)
              else:
                  s += tools_css + tools_js
              html.write_text(s)

          # --- Modernize HTML/WebView screens without replacing app functionality ---
          css = r"""
          <style id="canva-player-modern-refresh">
          :root{
            --cp-bg:#f6f7fb;--cp-surface:rgba(255,255,255,.92);
            --cp-text:#172033;--cp-muted:#667085;--cp-accent:#6c63ff;
            --cp-border:rgba(16,24,40,.09);--cp-shadow:0 10px 30px rgba(16,24,40,.08);
          }
          @media(prefers-color-scheme:dark){
            :root{--cp-bg:#0b1020;--cp-surface:rgba(20,27,45,.94);--cp-text:#f4f6fb;--cp-muted:#aab3c5;--cp-border:rgba(255,255,255,.10);--cp-shadow:0 12px 34px rgba(0,0,0,.28)}
          }
          html,body{background:var(--cp-bg)!important;color:var(--cp-text)!important}
          body{font-family:Inter,Roboto,system-ui,-apple-system,sans-serif!important}
          button,.btn,[role=button]{border-radius:14px!important;border:1px solid var(--cp-border)!important;
            box-shadow:0 4px 14px rgba(16,24,40,.06);transition:transform .16s ease,box-shadow .16s ease}
          button:active,.btn:active,[role=button]:active{transform:scale(.98)}
          input,select,textarea{border-radius:12px!important;border:1px solid var(--cp-border)!important}
          .card,.panel,.tile,.tool-card,.dashboard-card,.modal,.sheet{
            border:1px solid var(--cp-border)!important;border-radius:20px!important;
            background:var(--cp-surface)!important;box-shadow:var(--cp-shadow)!important}
          header,.topbar,.app-header,.toolbar{backdrop-filter:blur(18px)!important;-webkit-backdrop-filter:blur(18px)!important}
          </style>
          """
          for html in root.glob("**/*.html"):
              if "canva-player-modern-refresh" in html.read_text(errors="ignore"):
                  continue
              s = html.read_text(errors="ignore")
              if re.search(r"</head>", s, re.I):
                  s = re.sub(r"</head>", css + "</head>", s, count=1, flags=re.I)
                  html.write_text(s)
          print("Canva Player visual refresh applied.")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK licenses & install required packages
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Using SDK at: $SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT" -type f -iname "sdkmanager" 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Could not find sdkmanager under $SDK_ROOT"
            exit 1
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Grant execute permission for gradlew (if usable)
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ] && [ -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x ./gradlew
          fi

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          # Only use ./gradlew if its wrapper jar actually exists — a gradlew
          # script with no gradle-wrapper.jar next to it always fails, so we
          # fall back to the "gradle" binary that setup-gradle already put on
          # PATH instead of letting that failure stop the build.
          if [ -f "./gradlew" ] && [ -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Using ./gradlew"
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            echo "gradle-wrapper.jar not found — using the gradle binary from setup-gradle instead"
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: canva-player-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
