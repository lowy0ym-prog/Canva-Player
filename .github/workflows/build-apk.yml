name: Build Canva Player APK

# Triggers on every push (e.g. whenever you upload/replace CanvaPlayer.zip)
# and can also be started by hand from the Actions tab.
permissions:
  contents: write

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate the project (unzip it if it was uploaded as a .zip)
        id: locate
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found $ZIP_FILE — extracting…"
            mkdir -p _extracted
            unzip -q -o "$ZIP_FILE" -d _extracted

            SETTINGS_FILE=$(find _extracted -maxdepth 4 -iname "settings.gradle.kts" | head -n 1)
            if [ -z "$SETTINGS_FILE" ]; then
              echo "::error::Could not find settings.gradle.kts inside the uploaded zip."
              exit 1
            fi
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          else
            if [ ! -f "settings.gradle.kts" ]; then
              echo "::error::No .zip found and no settings.gradle.kts at repo root."
              exit 1
            fi
            PROJECT_DIR="."
          fi

          echo "Building from: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK licenses & install required packages
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Using SDK at: $SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT" -type f -iname "sdkmanager" 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Could not find sdkmanager under $SDK_ROOT"
            exit 1
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Grant execute permission for gradlew (if usable)
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ] && [ -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x ./gradlew
          fi

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          # Only use ./gradlew if its wrapper jar actually exists — a gradlew
          # script with no gradle-wrapper.jar next to it always fails, so we
          # fall back to the "gradle" binary that setup-gradle already put on
          # PATH instead of letting that failure stop the build.
          if [ -f "./gradlew" ] && [ -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Using ./gradlew"
            ./gradlew assembleDebug -Pvc=${{ github.run_number }} -Pvn=2.0.${{ github.run_number }} --stacktrace --no-daemon
          else
            echo "gradle-wrapper.jar not found — using the gradle binary from setup-gradle instead"
            gradle assembleDebug -Pvc=${{ github.run_number }} -Pvn=2.0.${{ github.run_number }} --stacktrace --no-daemon
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: canva-player-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Keep a copy named for people
        run: cp ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk Folio.apk

      - name: Upload release copy
        uses: actions/upload-artifact@v4
        with:
          name: folio-apk
          path: Folio.apk
          if-no-files-found: error

      - name: Upload samples for the emulator test
        uses: actions/upload-artifact@v4
        with:
          name: ci-files
          path: |
            ci
            ci-samples

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with: { name: folio-apk }
      - uses: actions/download-artifact@v4
        with: { name: ci-files }
      - run: |
          ls -R . | head -40
          mv Folio.apk app.apk
          # artifact download flattens ci/ and ci-samples/ paths; restore if needed
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ci/emulator-test.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: shots

  release:
    needs: [build, emulator-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: folio-apk }
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v2.0.${{ github.run_number }}"
          gh release create "$TAG" Folio.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Folio $TAG" --latest \
            --notes "Install Folio.apk on your phone. It updates over the previous version (same signing key). Passed the emulator test."
