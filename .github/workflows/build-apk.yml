name: Build Canva Player APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate the project (unzip it if it was uploaded as a .zip)
        id: locate
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found $ZIP_FILE — extracting…"
            mkdir -p _extracted
            unzip -q -o "$ZIP_FILE" -d _extracted

            SETTINGS_FILE=$(find _extracted -maxdepth 4 -iname "settings.gradle.kts" | head -n 1)
            if [ -z "$SETTINGS_FILE" ]; then
              echo "::error::Could not find settings.gradle.kts inside the uploaded zip."
              exit 1
            fi
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          else
            if [ ! -f "settings.gradle.kts" ]; then
              echo "::error::No .zip found and no settings.gradle.kts at repo root."
              exit 1
            fi
            PROJECT_DIR="."
          fi

          echo "Building from: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Grant execute permission for gradlew (if present)
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: canva-player-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
